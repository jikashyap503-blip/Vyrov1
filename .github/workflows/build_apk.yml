                      const SizedBox(height: 12),
                      TextField(
                        controller: _postCtrl,
                        maxLines: 4,
                        decoration: const InputDecoration(hintText: 'Write something with #hashtags...'),
                      ),
                      const SizedBox(height: 14),
                      ElevatedButton(
                        onPressed: _createPost,
                        child: const Text('Publish Now'),
 
